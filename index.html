<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PodStudio — Studio de podcast dans le navigateur</title>
  <meta name="description" content="Enregistrez, montez et publiez votre podcast directement dans votre navigateur. Aucune installation, 100 % local, fonctionne hors ligne.">
  <meta name="theme-color" content="#080810">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PodStudio">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <h1 class="logo">
      <span class="logo-icon" aria-hidden="true">🎙️</span>
      <span class="logo-text">PodStudio</span>
      <span class="badge">Vite</span>
    </h1>
    <button id="mob-library-toggle" type="button" class="btn-icon mob-only" aria-label="Ouvrir la bibliothèque">📚</button>
  </header>

  <div class="app-layout">
    <aside class="app-sidebar">
      <nav class="main-nav" aria-label="Navigation principale">
        <button type="button" class="nav-btn" data-nav="guide"><span class="icon" aria-hidden="true">📖</span><span class="label">Guide</span></button>
        <button type="button" class="nav-btn" data-nav="studio"><span class="icon" aria-hidden="true">🔴</span><span class="label">Studio</span></button>
        <button type="button" class="nav-btn" data-nav="editor"><span class="icon" aria-hidden="true">🎚️</span><span class="label">Éditeur</span></button>
        <button type="button" class="nav-btn" data-nav="episodes"><span class="icon" aria-hidden="true">🚀</span><span class="label">Épisodes</span></button>
        <span class="nav-spacer"></span>
        <button type="button" class="nav-btn" data-nav="settings"><span class="icon" aria-hidden="true">⚙️</span><span class="label">Paramètres</span></button>
      </nav>
    </aside>

    <main id="app-content">
      <div class="view-wrapper">
        <section id="view-guide" class="view hidden" data-view-name="guide" aria-label="Guide"></section>
        <section id="view-studio" class="view hidden" data-view-name="studio" aria-label="Studio"></section>
        <section id="view-editor" class="view hidden" data-view-name="editor" aria-label="Éditeur"></section>
        <section id="view-episodes" class="view hidden" data-view-name="episodes" aria-label="Épisodes"></section>
        <section id="view-settings" class="view hidden" data-view-name="settings" aria-label="Paramètres"></section>
      </div>
      <aside id="library-panel" class="app-library" aria-label="Bibliothèque"></aside>
    </main>
  </div>

  <nav class="mobile-bottom-nav" aria-label="Navigation mobile">
    <button type="button" class="mobile-nav-btn" data-nav="guide"><span class="icon" aria-hidden="true">📖</span><span class="label">Guide</span></button>
    <button type="button" class="mobile-nav-btn" data-nav="studio"><span class="icon" aria-hidden="true">🔴</span><span class="label">Studio</span></button>
    <button type="button" class="mobile-nav-btn" data-nav="editor"><span class="icon" aria-hidden="true">🎚️</span><span class="label">Éditeur</span></button>
    <button type="button" class="mobile-nav-btn" data-nav="episodes"><span class="icon" aria-hidden="true">🚀</span><span class="label">Épisodes</span></button>
    <button type="button" class="mobile-nav-btn" data-nav="settings"><span class="icon" aria-hidden="true">⚙️</span><span class="label">Réglages</span></button>
  </nav>

  <div id="library-modal" class="library-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Bibliothèque">
    <div class="modal-header">
      <span class="modal-grip" aria-hidden="true"></span>
      <button id="library-modal-close" type="button" class="btn-icon" aria-label="Fermer la bibliothèque">✕</button>
    </div>
    <div id="library-modal-content" class="modal-content"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
