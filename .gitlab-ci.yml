# .gitlab-ci.yml pour PodStudio sur La Forge des Communs Numériques Éducatifs
# Build Vite et déploiement automatique sur GitLab Pages

image: node:20-alpine

pages:
  stage: deploy
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run ci
    - rm -rf public
    - mv dist public
    - cp -f .nojekyll public/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "main"'
