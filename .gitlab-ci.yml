# .gitlab-ci.yml pour PodStudio Static sur La Forge des Communs Numériques Éducatifs
# Déploiement automatique sur GitLab Pages

image: alpine:latest

pages:
  stage: deploy
  script:
    # 1. Création du dossier cible pour GitLab Pages
    - mkdir -p public
    # 2. Copie explicite des fichiers et dossiers de l'application statique
    - cp -r index.html manifest.json sw.js css js assets vendor public/
    # 3. Inclusion du fichier .nojekyll pour désactiver le traitement Jekyll
    - cp -f .nojekyll public/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "main"'

