# .gitlab-ci.yml pour PodStudio Static sur La Forge des Communs Numériques Éducatifs
# Déploiement automatique sur GitLab Pages

image: alpine:latest

pages:
  stage: deploy
  script:
    # 1. Création d'un dossier temporaire caché pour éviter les erreurs de récursion
    - mkdir .public
    # 2. Copie de tous les fichiers existants du projet sans planter
    - cp -r * .public
    # 3. Renommage vers le dossier public final requis par Pages
    - mv .public public
    # 4. Inclusion du fichier .nojekyll s'il existe
    - cp -f .nojekyll public/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "main"'
